[project]
name = "signalgate-playground"
version = "0.0.1"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "SignalGate" }]
dependencies = [
    "signalgate==0.3.2",
    "fastapi",
    "uvicorn[standard]",
    "rich",
    "prompt_toolkit",
    "watchfiles",
    "httpx",
    "filelock",
]

[project.scripts]
playground = "playground.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playground"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "e2e: end-to-end tests",
    "perf: performance/timing tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["playground", "app"]
